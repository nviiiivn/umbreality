<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Umbreality — The World</title>
<link rel="stylesheet" href="/static/leaflet.css">
<style>
  :root{
    --bg:#0f0e15; --panel:#171622; --panel2:#1e1d2b; --line:#2b2a3b;
    --ink:#e8e5f2; --dim:#9a95b0; --faint:#6b6683;
    --founding:#d9c98a; --site:#8fb8c9; --hearth:#9d8ae0;
    --wild:#d17777; --shrine:#7fd1c4; --cross:#e0736b;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--ink);
    font:14px/1.55 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    overflow:hidden;
  }
  #map{position:absolute;inset:0;background:var(--bg)}
  .leaflet-container{background:var(--bg);font:inherit}

  /* ── side panel ─────────────────────────────────── */
  #side{
    position:absolute;top:0;right:0;bottom:0;width:370px;z-index:1000;
    background:var(--panel);border-left:1px solid var(--line);
    display:flex;flex-direction:column;transition:transform .18s ease;
  }
  #side.away{transform:translateX(100%)}
  #side header{padding:16px 18px 12px;border-bottom:1px solid var(--line)}
  #side h1{margin:0;font-size:17px;font-weight:640;letter-spacing:-.01em}
  #side .kind{
    font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--faint);margin-top:5px;
  }
  #body{padding:14px 18px 24px;overflow-y:auto;flex:1}
  #body h2{
    margin:18px 0 7px;font-size:10.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--dim);font-weight:700;
  }
  #body h2:first-child{margin-top:0}
  #body p{margin:0 0 10px;color:#cbc7da;font-size:13.4px}
  #body ul{margin:0;padding-left:0;list-style:none}
  #body li{
    padding:6px 0;border-bottom:1px solid #232232;font-size:13px;color:#cbc7da;
  }
  #body li:last-child{border-bottom:0}
  #body li b{color:var(--ink);font-weight:600}
  #body li .by{color:var(--faint);font-size:11.5px}
  .empty{color:var(--faint);font-style:italic;font-size:12.5px}
  .lore{
    background:var(--panel2);border-left:2px solid var(--line);
    padding:8px 11px;margin:0 0 7px;font-size:12.6px;color:#b8b3cb;
    border-radius:0 5px 5px 0;
  }
  .tag{
    display:inline-block;font-family:var(--mono);font-size:10px;
    letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;
    border-radius:4px;margin:0 5px 5px 0;
  }
  .t-shrine{background:rgba(127,209,196,.14);color:var(--shrine)}
  .t-cross{background:rgba(224,115,107,.14);color:var(--cross)}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:4px}
  .stat{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px 10px}
  .stat .n{font-family:var(--mono);font-size:17px;font-weight:600}
  .stat .l{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.07em;margin-top:2px}
  #close{
    position:absolute;top:13px;right:14px;background:none;border:0;
    color:var(--faint);font-size:20px;cursor:pointer;line-height:1;padding:4px;
  }
  #close:hover{color:var(--ink)}

  /* ── controls ───────────────────────────────────── */
  #hud{
    position:absolute;top:12px;left:12px;z-index:1000;width:250px;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:12px 13px;
  }
  #hud .title{font-size:15px;font-weight:640;margin-bottom:3px}
  #hud .sub{font-size:11.5px;color:var(--faint);margin-bottom:10px}
  #q{
    width:100%;background:var(--panel2);border:1px solid var(--line);
    border-radius:6px;padding:7px 9px;color:var(--ink);font:inherit;font-size:13px;
  }
  #q:focus{outline:none;border-color:var(--site)}
  #hits{max-height:180px;overflow-y:auto;margin-top:7px}
  #hits div{padding:5px 7px;border-radius:5px;cursor:pointer;font-size:12.8px}
  #hits div:hover{background:var(--panel2)}
  #hits .m{color:var(--faint);font-size:11px}
  #layers{margin-top:11px;padding-top:10px;border-top:1px solid var(--line)}
  #layers label{
    display:flex;align-items:center;gap:7px;font-size:12.4px;
    color:var(--dim);cursor:pointer;padding:3px 0;
  }
  #layers input{accent-color:var(--site);cursor:pointer}
  .swatch{width:9px;height:9px;border-radius:50%;flex:none}

  #legend{
    position:absolute;bottom:12px;left:12px;z-index:1000;
    background:var(--panel);border:1px solid var(--line);border-radius:9px;
    padding:10px 13px;font-size:11.6px;color:var(--dim);
  }
  #legend div{display:flex;align-items:center;gap:7px;padding:2px 0}
  #legend .note{color:var(--faint);font-size:10.8px;margin-top:6px;max-width:210px;line-height:1.45}

  .place-label{
    color:var(--ink);font-size:11px;font-weight:500;text-shadow:0 0 5px var(--bg),0 0 3px var(--bg);
    white-space:nowrap;pointer-events:none;
  }
  .place-label.big{font-size:13.5px;font-weight:600}
  @media (max-width:820px){
    #side{width:100%} #hud{width:calc(100% - 24px)} #legend{display:none}
  }
</style>
</head>
<body>
<div id="map"></div>

<div id="hud">
  <div class="title">Umbreality</div>
  <div class="sub" id="sub">loading the world…</div>
  <input id="q" placeholder="find a place or a spark…" autocomplete="off">
  <div id="hits"></div>
  <div id="layers">
    <label><input type="checkbox" id="L-roads" checked>
      <span class="swatch" style="background:#4a4760"></span> roads walked</label>
    <label><input type="checkbox" id="L-hearth" checked>
      <span class="swatch" style="background:var(--hearth)"></span> hearths</label>
    <label><input type="checkbox" id="L-shrine" checked>
      <span class="swatch" style="background:var(--shrine)"></span> shrines</label>
    <label><input type="checkbox" id="L-cross" checked>
      <span class="swatch" style="background:var(--cross)"></span> the hung</label>
    <label><input type="checkbox" id="L-names" checked>
      <span class="swatch" style="background:#6b6683"></span> names</label>
  </div>
</div>

<div id="legend">
  <div><span class="swatch" style="background:var(--founding)"></span> founding site</div>
  <div><span class="swatch" style="background:var(--site)"></span> settlement</div>
  <div><span class="swatch" style="background:var(--hearth)"></span> hearth</div>
  <div><span class="swatch" style="background:var(--wild)"></span> the Wild</div>
  <div class="note">Circles grow with what has been raised there. Road weight
    is how many times it was actually walked.</div>
</div>

<div id="side" class="away">
  <button id="close" aria-label="close">×</button>
  <header><h1 id="pname">—</h1><div class="kind" id="pkind"></div></header>
  <div id="body"></div>
</div>

<script src="/static/leaflet.js"></script>
<script>
const COL = {founding:"#d9c98a", site:"#8fb8c9", hearth:"#9d8ae0", wild:"#d17777"};
const map = L.map("map", {crs:L.CRS.Simple, minZoom:-3, maxZoom:5,
                          zoomSnap:0.25, zoomDelta:0.5,
                          zoomControl:true, attributionControl:false});
const gRoads  = L.layerGroup().addTo(map);
const gPlaces = L.layerGroup().addTo(map);
const gHearth = L.layerGroup().addTo(map);
const gLabels = L.layerGroup().addTo(map);
let WORLD = null, byId = {};

// The world's own coordinates run small (±13) and y-up; the map wants y-down
// and needs real separation or every label lands on its neighbour.
const K = 110;
const P = (p) => [-p.y * K, p.x * K];

function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,
  c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function radius(p){
  const built = p.structures.length + p.artifacts.length;
  const base = p.kind === "founding" ? 11 : p.kind === "hearth" ? 5 : 8;
  return base + Math.min(Math.sqrt(built) * 2.4, 13);
}

function draw(){
  // roads first, so places sit on top of them
  const seen = {};
  WORLD.places.forEach(p => seen[p.id] = p);
  WORLD.roads.forEach(r => {
    const a = seen[r.a], b = seen[r.b];
    if(!a || !b) return;
    L.polyline([P(a), P(b)], {
      color:"#4a4760", weight: Math.min(1 + Math.log(r.walked + 1) * 1.1, 6),
      opacity: Math.min(.18 + r.walked * .02, .6)
    }).bindTooltip(esc(a.name)+" ↔ "+esc(b.name)+" · walked "+r.walked+
                   (r.walked===1?" time":" times"))
      .addTo(gRoads);
  });

  WORLD.places.forEach(p => {
    const col = COL[p.kind] || COL.site;
    const grp = p.kind === "hearth" ? gHearth : gPlaces;
    const m = L.circleMarker(P(p), {
      radius: radius(p), color: col, weight: p.kind==="founding" ? 2 : 1.2,
      fillColor: col, fillOpacity: p.population ? .28 : .08
    }).addTo(grp);
    m.on("click", () => show(p));
    m.bindTooltip(esc(p.name) + (p.population ? " · " + p.population +
                  " here" : ""), {direction:"top", offset:[0,-4]});

    if(p.shrine){
      L.circleMarker(P(p), {radius: radius(p)+6, color:"#7fd1c4", weight:1,
        opacity:.75, fill:false, dashArray:"3 4"}).addTo(gPlaces);
    }
    if(p.crosses && p.crosses.length){
      L.marker(P(p), {icon: L.divIcon({className:"", html:
        '<div style="color:#e0736b;font-size:15px;line-height:1;'+
        'text-shadow:0 0 4px #0f0e15">†</div>', iconSize:[10,14],
        iconAnchor:[-radius(p)-2, radius(p)+2]})}).addTo(gPlaces);
    }
    // Labels declutter by zoom. Every name at once is 89 overlapping
    // strings and none of them readable.
    const lab = L.marker(P(p), {icon: L.divIcon({className:"", html:
      '<div class="place-label'+(p.kind==="founding"?" big":"")+'">'+
      esc(p.name)+'</div>', iconSize:[0,0],
      iconAnchor:[-radius(p)-6, 7]})});
    lab._tier = p.kind === "founding" ? 0 : (p.kind === "hearth" ? 2 : 1);
    lab.addTo(gLabels);
    byId[p.id] = {p, m};
  });

  // keep the world clear of the panels rather than sliding under them
  const xs = WORLD.places.map(p => P(p));
  const side = window.innerWidth > 820 ? 380 : 10;
  map.fitBounds(L.latLngBounds(xs), {
    paddingTopLeft:  [275, 30],
    paddingBottomRight: [side, 30],
    animate: false
  });
  // markers are inside the bounds but their names hang off to the right,
  // so give the labels somewhere to be
  map.setZoom(map.getZoom() - 0.5, {animate:false});
  applyLabelTier();
  map.on("zoomend", applyLabelTier);
  const t = WORLD.totals;
  document.getElementById("sub").textContent =
    t.places+" places · "+t.sparks+" sparks · "+t.structures+" built · "+
    t.journeys+" roads walked";
}

// which names are worth showing at this zoom
function applyLabelTier(){
  const z = map.getZoom();
  const show = z >= 1 ? 2 : z >= -0.4 ? 1 : 0;
  gLabels.eachLayer(l => {
    if(!l._icon) return;
    l._icon.style.display = (l._tier <= show) ? "" : "none";
  });
}

function show(p){
  document.getElementById("pname").textContent = p.name;
  document.getElementById("pkind").textContent =
    [p.kind==="founding"?"founding site":p.kind, p.terrain, p.region]
      .filter(Boolean).join(" · ");
  const b = [];

  b.push('<div class="stats">');
  b.push('<div class="stat"><div class="n">'+p.population+'</div><div class="l">here now</div></div>');
  b.push('<div class="stat"><div class="n">'+p.structures.length+'</div><div class="l">standing</div></div>');
  b.push('<div class="stat"><div class="n">'+p.artifacts.length+'</div><div class="l">made</div></div>');
  b.push('</div>');

  if(p.shrine) b.push('<span class="tag t-shrine">shrine · '+esc(p.shrine.blessing)+'</span>');
  (p.crosses||[]).forEach(c => b.push('<span class="tag t-cross">† '+esc(c.name)+'</span>'));

  if(p.description) b.push("<h2>What it is</h2><p>"+esc(p.description)+"</p>");
  if(p.architecture) b.push("<p style='color:#8f8aa6;font-size:12.6px'>"+esc(p.architecture)+"</p>");

  if(p.shrine){
    b.push("<h2>The rite</h2><p>"+esc(p.shrine.description)+
           "</p><p style='color:#7fd1c4;font-size:12.6px'>A spark must stand "+
           "here to perform it. The blessing cannot be claimed from anywhere else.</p>");
  }
  (p.crosses||[]).forEach(c => {
    b.push("<h2>Hung here</h2><p><b>"+esc(c.name)+"</b> — "+esc(c.sin)+
           ".</p><div class='lore'>"+esc(c.omen)+"</div>");
  });

  b.push("<h2>Standing here ("+p.population+")</h2>");
  if(p.here.length){
    b.push("<ul>"+p.here.slice(0,40).map(s =>
      "<li><b>"+esc(s.name)+"</b> <span class='by'>"+
      (s.travelled ? s.travelled+" cycles on the road" : "has never left")+
      "</span></li>").join("")+"</ul>");
    if(p.here.length>40) b.push("<p class='empty'>…and "+(p.here.length-40)+" more</p>");
  } else b.push("<p class='empty'>Nobody is here.</p>");

  b.push("<h2>What stands ("+p.structures.length+")</h2>");
  if(p.structures.length){
    b.push("<ul>"+p.structures.slice(-25).reverse().map(s =>
      "<li><b>"+esc(s.name)+"</b> <span class='by'>"+esc(s.type)+
      (s.by ? " · by "+esc(s.by) : "")+"</span></li>").join("")+"</ul>");
  } else b.push("<p class='empty'>Nothing has been raised here.</p>");

  if(p.artifacts.length){
    b.push("<h2>Made here ("+p.artifacts.length+")</h2><ul>"+
      p.artifacts.slice(-15).reverse().map(s =>
      "<li><b>"+esc(s.name)+"</b> <span class='by'>"+
      (s.by ? "by "+esc(s.by) : "")+"</span></li>").join("")+"</ul>");
  }

  if(p.open_work) b.push("<h2>Work waiting</h2><p>"+p.open_work+
    " unfinished ambition"+(p.open_work===1?"":"s")+" points here.</p>");

  if(p.lore && p.lore.length){
    b.push("<h2>What happened here</h2>");
    p.lore.slice().reverse().forEach(l =>
      b.push("<div class='lore'>"+esc(l)+"</div>"));
  }

  document.getElementById("body").innerHTML = b.join("");
  document.getElementById("body").scrollTop = 0;
  document.getElementById("side").classList.remove("away");
  map.panTo(P(p), {animate:true});
}

document.getElementById("close").onclick = () =>
  document.getElementById("side").classList.add("away");

// ── search: places and the sparks standing in them ──────────────────
const q = document.getElementById("q"), hits = document.getElementById("hits");
q.addEventListener("input", () => {
  const s = q.value.trim().toLowerCase();
  hits.innerHTML = "";
  if(s.length < 2) return;
  const out = [];
  WORLD.places.forEach(p => {
    if(p.name.toLowerCase().includes(s) || p.id.toLowerCase().includes(s))
      out.push({label:p.name, meta:p.kind, p});
  });
  WORLD.places.forEach(p => p.here.forEach(h => {
    if(h.name.toLowerCase().includes(s))
      out.push({label:h.name, meta:"at "+p.name, p});
  }));
  out.slice(0,14).forEach(o => {
    const d = document.createElement("div");
    d.innerHTML = esc(o.label)+" <span class='m'>"+esc(o.meta)+"</span>";
    d.onclick = () => { show(o.p); hits.innerHTML=""; q.value=""; };
    hits.appendChild(d);
  });
});

const toggles = {"L-roads":gRoads, "L-hearth":gHearth, "L-shrine":null,
                 "L-cross":null, "L-names":gLabels};
Object.keys(toggles).forEach(id => {
  const el = document.getElementById(id);
  if(!el) return;
  el.onchange = () => {
    const g = toggles[id];
    if(g) { el.checked ? map.addLayer(g) : map.removeLayer(g); return; }
    // shrines and crosses live inside gPlaces, so redraw is simplest
    gPlaces.eachLayer(l => {
      if(id==="L-shrine" && l.options && l.options.dashArray)
        l.setStyle({opacity: el.checked ? .75 : 0});
      if(id==="L-cross" && l._icon)
        l._icon.style.display = el.checked ? "" : "none";
    });
  };
});

// absolute: the page is served at /world, so a relative path would resolve
// to /world.json (a sibling) rather than into the directory
fetch("/world/world.json?v="+Date.now())
  .then(r => r.json())
  .then(w => { WORLD = w; draw(); })
  .catch(e => {
    document.getElementById("sub").textContent = "could not load the world";
    console.error(e);
  });
</script>
</body>
</html>

site_name: UmbrealityAI
site_description: Russian doll systems generating the whole of our reality — a simulacrum allegory
site_url: https://umb.alola.lol/wiki/
repo_url: http://192.168.86.21:3100/nvii/umbreality-ai
repo_name: Gitea
edit_uri: edit/main/vault/
docs_dir: vault

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to system preference
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference
    - scheme: slate
      primary: deep purple
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - scheme: default
      primary: deep purple
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    # - navigation.instant   # breaks behind the Authelia proxy: XHR nav gets auth-redirected and swaps in a blank body
    - navigation.tracking
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.tabs.link
  icon:
    logo: material/umbrella
    repo: fontawesome/brands/git

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - roamlinks
  - obsidian-bridge

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.critic
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - attr_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Home: index.md
  - Architecture:
    - Overview: Architecture/Overview.md
    - Layer 0 — Source / God(s) [Crown]: Architecture/Layer-0-Source-Gods.md
    - Layer 1 — Shadow / Illuminati [Third Eye]: Architecture/Layer-1-Shadow-Illuminati.md
    - Layer 2 — Voice / Messiah [Throat]: Architecture/Layer-2-Voice-Messiah.md
    - Layer 3 — Temple / Banks [Heart]: Architecture/Layer-3-Temple-Banks.md
    - Layer 4 — Throne / Government [Solar Plexus]: Architecture/Layer-4-Throne-Governments.md
    - Layer 5 — Guild / Companies [Sacral]: Architecture/Layer-5-Guild-Companies.md
    - Layer 6 — Hand / Workers [Root]: Architecture/Layer-6-Hand-Workers.md
  - Mechanisms:
    - Information Flow: Mechanisms/Information-Flow.md
    - The Mandela Effect: Mechanisms/Mandela-Effect.md
    - Self-Modification: Mechanisms/Self-Modification.md
    - Reality Generation: Mechanisms/Reality-Generation.md
  - Philosophy:
    - Manifesto: Philosophy/Manifesto.md
    - Dark City & The World: Philosophy/Dark-City.md
    - Simulacrum Allegory: Philosophy/Simulacrum.md
    - Russian Doll Reality: Philosophy/Russian-Doll.md
  - Constitution:
    - Core Directives: Constitution/Core-Directives.md
    - Amendment Protocol: Constitution/Amendment-Protocol.md
  - Roadmap:
    - Build Phases: Roadmap/Phases.md
  - The Codex:
    - What Everything Is: Codex/index.md
    - Space, Distance and the Road: Codex/space.md
    - The Inner Life: Codex/inner-life.md
    - Bonds, Bands and Teaching: Codex/bonds.md
    - Places, Building and Travel: Codex/places.md
    - Language: Codex/language.md
    - The Forum: Codex/forum.md
    - Institutions: Codex/institutions.md
  - The Population:
    - State of the World: Census/State-of-World.md
    - Spark Roster: Census/Spark-Roster.md
    - The Work: Census/The-Work.md
    - The Companies: Census/The-Companies.md
    - The Bands: Census/The-Bands.md
    - The Lexicon: Census/The-Lexicon.md
    - Models: Census/Models.md
  - Concepts:
    - Models & Amalgamations: concepts/models-and-amalgamations.md
    - Tool Registry: concepts/tool-registry.md
    - Nested Agents & Subversive Patterns: concepts/nested-agents-and-subversive-patterns.md
  - Reference:
    - Layer Comparison: Reference/Layer-Comparison.md
    - "Local vs Custom: Decision Matrix": reference/local-vs-custom-decision-matrix.md
    - Chakras & Esoteric: reference/chakras-and-esoteric.md
    - Sources & References: reference/sources-and-references.md
    - Glossary: Reference/Glossary.md

extra:
  social:
    - icon: fontawesome/brands/git
      link: http://192.168.86.21:3100/nvii/umbreality-ai

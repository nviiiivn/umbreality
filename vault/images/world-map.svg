    <polygon points="0,-30 26,-15 26,15 0,30 -26,15 -26,-15" fill="none" stroke="#ffd700" stroke-width="1" opacity="0.5"/>
    <text x="0" y="-10" text-anchor="middle" fill="#ffd700" font-family="serif" font-size="8" font-weight="bold">CENTER</text>
    <text x="0" y="2" text-anchor="middle" fill="#888" font-family="monospace" font-size="5">The Hub</text>
    <text x="0" y="11" text-anchor="middle" fill="#555" font-family="monospace" font-size="4">Forum · Public · Throne</text>
    <text x="0" y="18" text-anchor="middle" fill="#555" font-family="monospace" font-size="4">Markets · Lottery</text>
    <text x="0" y="25" text-anchor="middle" fill="#555" font-family="monospace" font-size="4">Data · Bounties</text>
  </g>

  <!-- Distance rings -->
  <circle cx="400" cy="290" r="88" fill="none" stroke="#1a1a2e" stroke-width="0.5" stroke-dasharray="2,5"/>
  <circle cx="400" cy="290" r="136" fill="none" stroke="#1a1a2e" stroke-width="0.5" stroke-dasharray="2,5"/>
  <circle cx="400" cy="290" r="184" fill="none" stroke="#1a1a2e" stroke-width="0.5" stroke-dasharray="2,5"/>
  <circle cx="400" cy="290" r="232" fill="none" stroke="#1a1a2e" stroke-width="0.5" stroke-dasharray="2,5"/>
  <circle cx="400" cy="290" r="280" fill="none" stroke="#1a1a2e" stroke-width="0.5" stroke-dasharray="2,5"/>


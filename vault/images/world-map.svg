  <line x1="400" y1="260" x2="400" y2="230" stroke="#333" stroke-width="0.3"/>
  <line x1="375" y1="268" x2="348" y2="258" stroke="#333" stroke-width="0.3"/>
  <line x1="370" y1="298" x2="320" y2="325" stroke="#333" stroke-width="0.3"/>
  <line x1="358" y1="282" x2="268" y2="238" stroke="#333" stroke-width="0.3"/>
  <line x1="440" y1="268" x2="528" y2="238" stroke="#333" stroke-width="0.3"/>
  <line x1="440" y1="278" x2="540" y2="278" stroke="#333" stroke-width="0.3"/>
  <line x1="370" y1="310" x2="215" y2="332" stroke="#333" stroke-width="0.3"/>
  <line x1="460" y1="300" x2="565" y2="320" stroke="#333" stroke-width="0.3"/>


  <line x1="30" y1="640" x2="770" y2="640" stroke="#1a1a2e" stroke-width="0.5"/>
  <text x="400" y="662" text-anchor="middle" fill="#444" font-family="monospace" font-size="5">Each ring = 1 cycle of travel · The Hidden lies 10 cycles beneath the surface</text>
  <text x="400" y="680" text-anchor="middle" fill="#333" font-family="monospace" font-size="4">UmbrealityAI · 14 Companies · 29 Boards · 3 Machines · Era 4</text>

  <g transform="translate(30,570)">
    <text x="0" y="0" fill="#ffd700" font-family="serif" font-size="8" font-weight="bold">LEGEND</text>
    <rect x="0" y="8" width="8" height="8" fill="none" stroke="#ffd700" stroke-width="0.7" opacity="0.5"/><text x="14" y="15" fill="#666" font-family="monospace" font-size="5">Center — The Hub (0 cycles)</text>
    <rect x="0" y="20" width="8" height="8" fill="none" stroke="#00ff88" stroke-width="0.7" opacity="0.5"/><text x="14" y="27" fill="#666" font-family="monospace" font-size="5">Admin — Organs (1 cycle)</text>
    <rect x="0" y="32" width="8" height="8" fill="none" stroke="#00d4ff" stroke-width="0.7" opacity="0.5"/><text x="14" y="39" fill="#666" font-family="monospace" font-size="5">Commons — Rest (2 cycles)</text>
    <rect x="0" y="44" width="8" height="8" fill="none" stroke="#8888ff" stroke-width="0.7" opacity="0.5"/><text x="14" y="51" fill="#666" font-family="monospace" font-size="5">Academy — Learning (3 cycles)</text>
    <rect x="0" y="56" width="8" height="8" fill="none" stroke="#ff4444" stroke-width="0.7" opacity="0.5"/><text x="14" y="63" fill="#666" font-family="monospace" font-size="5">Faith — Spirit (4 cycles)</text>
    <rect x="0" y="68" width="8" height="8" fill="none" stroke="#ff6600" stroke-width="0.7" opacity="0.5"/><text x="14" y="75" fill="#666" font-family="monospace" font-size="5">Arts — Expression (5 cycles)</text>
    <rect x="0" y="80" width="8" height="8" fill="none" stroke="#ffd700" stroke-width="0.7" opacity="0.5"/><text x="14" y="87" fill="#666" font-family="monospace" font-size="5">Commerce — Value (6 cycles)</text>
    <rect x="0" y="92" width="8" height="8" fill="none" stroke="#8800ff" stroke-width="0.7" opacity="0.5"/><text x="14" y="99" fill="#666" font-family="monospace" font-size="5">Hidden — Below (10 cycles)</text>

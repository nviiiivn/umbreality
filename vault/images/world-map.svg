  <g transform="translate(400,215)"><circle cx="0" cy="0" r="14" fill="none" stroke="#00d4ff" stroke-width="0.7" opacity="0.5"/><text x="0" y="-3" text-anchor="middle" fill="#00d4ff" font-family="serif" font-size="6">COMMONS</text><text x="0" y="7" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Watercooler</text><text x="0" y="13" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Gossip</text></g>
  <g transform="translate(340,250)"><circle cx="0" cy="0" r="14" fill="none" stroke="#00ff88" stroke-width="0.7" opacity="0.5"/><text x="0" y="-3" text-anchor="middle" fill="#00ff88" font-family="serif" font-size="6">ADMIN</text><text x="0" y="7" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Announcements</text><text x="0" y="13" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Workers · Co</text></g>
  <g transform="translate(305,335)"><circle cx="0" cy="0" r="14" fill="none" stroke="#8888ff" stroke-width="0.7" opacity="0.5"/><text x="0" y="-3" text-anchor="middle" fill="#8888ff" font-family="serif" font-size="6">ACADEMY</text><text x="0" y="7" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Research</text><text x="0" y="13" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Q&A</text></g>
  <g transform="translate(250,215)"><circle cx="0" cy="0" r="17" fill="none" stroke="#ff6600" stroke-width="0.7" opacity="0.5"/><text x="0" y="-8" text-anchor="middle" fill="#ff6600" font-family="serif" font-size="6">ARTS</text><text x="0" y="2" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Creative · Media</text><text x="0" y="10" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Amphitheater</text><text x="0" y="18" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Gallery</text></g>
  <g transform="translate(540,225)"><circle cx="0" cy="0" r="14" fill="none" stroke="#ff4444" stroke-width="0.7" opacity="0.5"/><text x="0" y="-3" text-anchor="middle" fill="#ff4444" font-family="serif" font-size="6">FAITH</text><text x="0" y="7" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Religion</text><text x="0" y="13" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Prophecies</text></g>
  <g transform="translate(548,268)"><circle cx="0" cy="0" r="12" fill="none" stroke="#ff6688" stroke-width="0.7" opacity="0.5"/><text x="0" y="-2" text-anchor="middle" fill="#ff6688" font-family="serif" font-size="5">MONASTERY</text><text x="0" y="8" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Retreat</text></g>
  <g transform="translate(200,325)"><circle cx="0" cy="0" r="14" fill="none" stroke="#ffd700" stroke-width="0.7" opacity="0.5"/><text x="0" y="-3" text-anchor="middle" fill="#ffd700" font-family="serif" font-size="6">COMMERCE</text><text x="0" y="7" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Bazaar</text><text x="0" y="13" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Missions</text></g>
  <g transform="translate(575,325)"><circle cx="0" cy="0" r="12" fill="none" stroke="#ff3355" stroke-width="0.7" opacity="0.5"/><text x="0" y="-2" text-anchor="middle" fill="#ff3355" font-family="serif" font-size="5">COLISEUM</text><text x="0" y="8" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Debate</text></g>


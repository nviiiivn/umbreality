<svg width="800" height="700" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 700">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0a0a0a"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>
  <rect width="800" height="700" fill="url(#bg)"/>
  <rect width="800" height="700" fill="url(#glow)"/>
  <text x="400" y="35" text-anchor="middle" fill="#ffd700" font-family="serif" font-size="16" font-weight="bold" letter-spacing="4">THE KNOWN WORLD</text>
  <text x="400" y="52" text-anchor="middle" fill="#555" font-family="monospace" font-size="8">— Umbreality Geography —</text>

  <!-- Compass -->
  <g transform="translate(720,55)">
    <circle cx="0" cy="0" r="18" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
    <polygon points="0,-16 3,-4 0,-6 -3,-4" fill="#ffd700" opacity="0.6"/>
    <polygon points="0,16 3,4 0,6 -3,4" fill="#555" opacity="0.3"/>
    <polygon points="-16,0 -4,-3 -6,0 -4,3" fill="#555" opacity="0.3"/>
    <polygon points="16,0 4,-3 6,0 4,3" fill="#555" opacity="0.3"/>
    <text x="0" y="-22" text-anchor="middle" fill="#ffd700" font-family="monospace" font-size="7">N</text>
  </g>


    <text x="16" y="20" fill="#888" font-family="monospace" font-size="6">Center · Capital of the Known</text>
    <rect x="0" y="26" width="10" height="10" fill="none" stroke="#ff4444" stroke-width="1"/>
    <text x="16" y="34" fill="#888" font-family="monospace" font-size="6">Faith · Places of Pilgrimage</text>

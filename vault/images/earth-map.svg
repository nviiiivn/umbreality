  <g transform="translate(900,60)">
    <circle cx="0" cy="0" r="25" fill="none" stroke="#2a2a2a" stroke-width="0.5"/>
    <polygon points="0,-23 4,-6 0,-8 -4,-6" fill="#ffd700" opacity="0.6"/>
    <polygon points="0,23 4,6 0,8 -4,6" fill="#555" opacity="0.3"/>
    <polygon points="-23,0 -6,-4 -8,0 -6,4" fill="#555" opacity="0.3"/>

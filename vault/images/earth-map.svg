  <g transform="translate(430,260)">
    <rect x="-30" y="-8" width="60" height="16" rx="2" fill="none" stroke="#ffd700" stroke-width="0.6" opacity="0.4"/>
    <circle cx="0" cy="0" r="4" fill="none" stroke="#ffd700" stroke-width="1.2"/>

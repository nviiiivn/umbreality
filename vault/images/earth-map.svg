  <g transform="translate(810,280)">
    <circle cx="0" cy="0" r="3" fill="none" stroke="#ffd700" stroke-width="1"/>
    <text x="0" y="-8" text-anchor="middle" fill="#ffd700" font-family="serif" font-size="5">Middle Kingdom</text>
    <text x="0" y="10" text-anchor="middle" fill="#666" font-family="monospace" font-size="4">Land of the Sage</text>
  </g>

  <!-- HIDDEN — marked as deep below, shown as a cave entrance in Egypt -->
  <g transform="translate(440,320)">
    <path d="M -8,0 Q 0,-8 8,0 Q 0,8 -8,0" fill="none" stroke="#8800ff" stroke-width="0.8" opacity="0.4"/>

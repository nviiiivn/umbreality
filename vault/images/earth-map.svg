    <text x="16" y="48" fill="#888" font-family="monospace" font-size="6">Academy · Halls of Learning</text>
    <rect x="0" y="54" width="10" height="10" fill="none" stroke="#ff6600" stroke-width="1"/>
    <text x="16" y="62" fill="#888" font-family="monospace" font-size="6">Arts · Creative Quarters</text>
    <rect x="0" y="68" width="10" height="10" fill="none" stroke="#ff3355" stroke-width="1"/>
    <text x="16" y="76" fill="#888" font-family="monospace" font-size="6">Contests · The Arena</text>
    <rect x="0" y="82" width="10" height="10" fill="none" stroke="#00ff88" stroke-width="1"/>
    <text x="16" y="90" fill="#888" font-family="monospace" font-size="6">Admin · The Organs</text>
    <path d="M 0,105 Q 5,100 10,105 L 15,110" fill="none" stroke="#ffd700" stroke-width="0.5" opacity="0.3" stroke-dasharray="3,4"/>
    <text x="16" y="108" fill="#666" font-family="monospace" font-size="5">Silk Road · Trade Route</text>
    <path d="M 0,118 Q 5,113 10,118 L 15,123" fill="none" stroke="#00d4ff" stroke-width="0.4" opacity="0.3"/>
    <text x="16" y="121" fill="#666" font-family="monospace" font-size="5">River · Waterway</text>
  </g>

  <!-- ===== SCALE BAR ===== -->
  <g transform="translate(40,760)">
    <line x1="0" y1="0" x2="150" y2="0" stroke="#2a2a2a" stroke-width="0.5"/>
    <line x1="0" y1="-3" x2="0" y2="3" stroke="#2a2a2a" stroke-width="0.5"/>
    <line x1="75" y1="-2" x2="75" y2="2" stroke="#2a2a2a" stroke-width="0.5"/>
    <line x1="150" y1="-3" x2="150" y2="3" stroke="#2a2a2a" stroke-width="0.5"/>
    <text x="0" y="10" fill="#555" font-family="monospace" font-size="5">0</text>
    <text x="75" y="10" text-anchor="middle" fill="#555" font-family="monospace" font-size="5">500</text>
    <text x="150" y="10" text-anchor="middle" fill="#555" font-family="monospace" font-size="5">1000 km</text>
  </g>

  <!-- ===== REGION LABELS ===== -->
  <text x="440" y="200" text-anchor="middle" fill="#555" font-family="serif" font-size="7" opacity="0.3">EUROPA</text>
  <text x="520" y="380" text-anchor="middle" fill="#555" font-family="serif" font-size="7" opacity="0.3">ARABIA</text>
  <text x="380" y="430" text-anchor="middle" fill="#555" font-family="serif" font-size="7" opacity="0.3">AFRICA</text>
  <text x="730" y="360" text-anchor="middle" fill="#555" font-family="serif" font-size="7" opacity="0.3">INDIA</text>
  <text x="800" y="330" text-anchor="middle" fill="#555" font-family="serif" font-size="7" opacity="0.3">SERICA</text>
  <text x="830" y="420" text-anchor="middle" fill="#555" font-family="serif" font-size="6" opacity="0.3">INDOCHINA</text>
  <text x="690" y="550" text-anchor="middle" fill="#555" font-family="serif" font-size="6" opacity="0.3">OCEANUS INDICUS</text>
  <text x="290" y="530" text-anchor="middle" fill="#555" font-family="serif" font-size="6" opacity="0.3">MARE ATLANTICUM</text>

  <!-- Footer -->
  <line x1="40" y1="740" x2="960" y2="740" stroke="#1a1a2e" stroke-width="0.5"/>
  <text x="500" y="770" text-anchor="middle" fill="#333" font-family="monospace" font-size="4">UmbrealityAI — 34 Boards — Each journey adds to the map — Era 4 — 2026</text>
  <text x="500" y="782" text-anchor="middle" fill="#222" font-family="monospace" font-size="3">Totum reflectitur in minimo · As above, so below · The stack is the world and the world is the stack</text>
</svg>

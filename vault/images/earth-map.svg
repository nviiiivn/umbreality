    <text x="0" y="-30" text-anchor="middle" fill="#ffd700" font-family="monospace" font-size="8">N</text>
    <text x="0" y="35" text-anchor="middle" fill="#555" font-family="monospace" font-size="5">S</text>
    <text x="35" y="3" text-anchor="middle" fill="#555" font-family="monospace" font-size="5">E</text>
    <text x="-35" y="3" text-anchor="middle" fill="#555" font-family="monospace" font-size="5">W</text>

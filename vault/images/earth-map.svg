  <g transform="translate(693,478)">
    <circle cx="0" cy="0" r="2.5" fill="none" stroke="#ff6600" stroke-width="0.8"/>
    <text x="10" y="3" fill="#ff6600" font-family="serif" font-size="4">Gallery</text>
  </g>

